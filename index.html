<style>
/* Layout concept: a calling card. One dark screen, the foil wordmark, one sentence, one address.
   Deliberately single-theme and static. */
:root{
  --onyx:#0D0A08; --espresso:#2A1C13; --ink:#F4ECDD; --ink-2:#B8A68C; --gold:#C8A45D; --champagne:#E8D3A0; --rule:#3D2B1F;
  --f-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --f-text:Raleway,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--onyx)}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--espresso) 0%,var(--onyx) 70%);background-color:var(--onyx);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;padding-block:48px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.logo{width:min(260px,62vw);height:auto;display:block}
.label{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:56px 0 0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,7vw,5.6rem);line-height:1;letter-spacing:-.035em;margin:20px 0 0;text-wrap:balance}
h1 em{font-style:italic;color:var(--champagne)}
.rule{width:56px;height:1px;background:var(--gold);margin:40px auto 0;border:0}
.mail{margin:32px 0 0;font-size:15px;font-weight:300;letter-spacing:.04em;color:var(--ink-2)}
.mail a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(232,211,160,.4);padding-bottom:3px}
.mail a:hover{border-bottom-color:var(--champagne)}
.foot{margin-top:72px;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#6E5D4C}
</style>
</head>
